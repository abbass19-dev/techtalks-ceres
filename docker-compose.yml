version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: ceres_mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ceres_db
    volumes:
      - ceres_mongo_data:/data/db
    restart: unless-stopped

volumes:
  ceres_mongo_data:
